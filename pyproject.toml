[project]
name = "sih141"
version = "0.1.0"
description = "Quantum-Inspired Cyber Threat Detection for Digital Signature Security (SIH26141)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
# `sih141` is on the list so that `--doctest-modules` collects the package's own
# docstrings. Every numeric claim in a docstring -- forgery probabilities,
# repudiation bounds, the Hoeffding exponent -- is a doctest, and until this
# entry existed none of them ran under `python -m pytest`: a mutation that
# halved `hoeffding_exponent` left the whole suite green while contradicting the
# function's own printed output. They are the numbers a reader trusts, so they
# are now tested like everything else.
testpaths = ["tests", "sih141"]
addopts = "-q --strict-markers --doctest-modules"

[tool.pyright]
# Pyright (the engine behind Pylance in the editor) is not a gate: it is not in
# `requirements.txt`, nothing runs it in CI, and the suite's authority is the
# 3460 tests. It is configured because a second, independent checker is worth
# having -- but only if its output is short enough to read. Unconfigured it
# reports 519 errors, not one of which is a runtime bug, and a checker nobody
# reads catches nothing.
#
# `pythonVersion` is the floor from `requires-python`, not the interpreter this
# was developed on, so a 3.13-only spelling (`typing.TypeIs`, say) is caught
# here rather than by a judge running 3.11.
pythonVersion = "3.11"
include = ["sih141", "tests"]

# -- Rules switched off, and why -------------------------------------------- #
# Every one is off because of a pattern this codebase uses *on purpose*, not
# because a warning was inconvenient. Each was read by hand before it was
# silenced, and the count each accounts for is recorded so that a later change
# in volume is visible.

# 320 reports from one design decision: the frozen dataclasses declare a field
# as its *post*-coercion type and coerce in `__post_init__`, so
# `RecordEntry(basis="Z")` is documented, tested and correct while the
# `__init__` pyright synthesises from the annotation says `basis: PauliBasis`.
# Eighty such coercion sites across seventeen modules.
#
# This is the expensive one to lose -- it is also the rule that would catch a
# genuinely wrong argument -- and it is off under protest. The real fix is
# `dataclasses.InitVar` or an explicit `__init__` at all eighty sites, which is
# a post-deadline refactor rather than a pre-deadline one.
reportArgumentType = "none"

# 148 reports, every one a narrowing the checker cannot follow rather than a
# value that is actually `None`. Two shapes: a guard stored in a variable and
# spent later (`recomputed = record is not None and ...`, then `if recomputed:`
# in `detect/statistics.py`), and an optional return unpacked by a test that
# has just established which branch it is in. Where the narrowing was fixable
# in the package it was fixed -- see `_accepted` in `attacks/replay.py` --
# rather than silenced.
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"

# 24 reports, all in `tests/`: numpy and qiskit internals (`ISeedSequence.
# entropy`, `BitGenerator.advance`), private attributes of the counting test
# doubles, and the deliberate wrong-type probes that exist to prove a refusal.
reportAttributeAccessIssue = "none"

# Qiskit types `DensityMatrix.num_qubits` and `QuantumRegister.num_qubits` as
# `int | None`, so `2**num_qubits` and `0 <= i < num_qubits` are errors in
# `sih141/core`. Eight reports, none of them ours.
reportOperatorIssue = "none"
reportOptionalOperand = "none"

# `detect/__init__.py` names its five submodules in `__all__`. They are bound
# as attributes at runtime by the `from .detector import ...` lines above them
# -- checked: 101 names, none missing, `import *` works -- but pyright does not
# model that side effect of importing a submodule.
reportUnsupportedDunderAll = "none"

# `refusals + 1` inside `pytest.raises(TypeError)` is not a dead expression:
# evaluating it *is* the assertion. Three reports, all of that shape.
reportUnusedExpression = "none"
